[project]
name = "astroclr"
dynamic = ["version"]
authors = [
  { name="Mark Hollands", email="mhollands14@gmail.com" },
]
description = "Calculate the perceived colours of astrophysical spectra"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

dependencies = [
    "astropy>=6.0.1",
    "matplotlib>=3.8.4",
    "numpy>=1.20",
    "scipy>=1.13",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/mahollands/astroclr"
Issues = "https://github.com/mahollands/astroclr/issues"

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/astroclr/__init__.py"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
xfail_strict = true
